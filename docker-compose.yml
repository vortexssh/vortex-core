services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vortex_core}
    volumes:
      - vortex_pg_data:/var/lib/postgresql/data
    ports:
      # Published for host-networked api (Docker bridge has no outbound route on this VPS).
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vortex

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - vortex_redis_data:/data
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - vortex

  api:
    build: .
    image: vortex-core:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Host network: reach DB/Redis via published localhost ports (not docker DNS names).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vortex}:${POSTGRES_PASSWORD}@127.0.0.1:15432/${POSTGRES_DB:-vortex_core}
      REDIS_URL: redis://127.0.0.1:16379/0
      APP_ENV: production
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Same stack as working curl/host — Docker bridge on this VPS cannot reach the internet
    # (DNS upstream timeout + TCP "No route to host" to public IPs).
    network_mode: host
    volumes:
      - vortex_geoip_data:/app/data
    # nginx proxies api.vortex.timant32.ru → 127.0.0.1:18000
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "127.0.0.1",
        "--port",
        "18000",
        "--proxy-headers",
        "--forwarded-allow-ips=*",
      ]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  vortex_pg_data:
  vortex_redis_data:
  vortex_geoip_data:

networks:
  vortex:
    driver: bridge
